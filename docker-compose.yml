services:
  app:
    build:
      context: .
    env_file:
      - .env.production
    restart: unless-stopped
    expose:
      - "3000"
    # The current ECS has 2 GB RAM. Leave capacity for Nginx and Docker.
    mem_limit: 900m
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - web

networks:
  web:
    driver: bridge
