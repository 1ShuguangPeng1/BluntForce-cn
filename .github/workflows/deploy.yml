name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

concurrency:
  group: bluntforce-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure the deployment key
        env:
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY_B64 is not configured"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
      - name: Trust the ECS host key
        run: ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Package and upload the source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          git bundle create bluntforce-deploy.bundle main
          ls -lh bluntforce-deploy.bundle
          scp -o BatchMode=yes -o ConnectTimeout=15 \
            bluntforce-deploy.bundle "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Check the ECS build base
        id: ecs_build_base
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker image inspect node:22-bookworm-slim > /dev/null 2>&1'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      # The ECS cannot reliably reach Docker Hub. Seed the Node build image once;
      # subsequent deployments reuse it and only transfer the small Git bundle.
      - name: Seed the Node build image on ECS
        if: steps.ecs_build_base.outputs.required == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          docker pull node:22-bookworm-slim
          docker save node:22-bookworm-slim | gzip -9 > node-22-bookworm-slim.tar.gz
          ls -lh node-22-bookworm-slim.tar.gz
          scp -o BatchMode=yes -o ConnectTimeout=15 \
            node-22-bookworm-slim.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'gzip -dc /tmp/node-22-bookworm-slim.tar.gz | docker load && rm -f /tmp/node-22-bookworm-slim.tar.gz'

      - name: Build and restart the ECS services
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             git fetch /tmp/bluntforce-deploy.bundle refs/heads/main:refs/remotes/deploy/main && \
             rm -f /tmp/bluntforce-deploy.bundle && \
             rm -f /tmp/bluntforce-cn-app.tar.gz && \
             git merge --ff-only refs/remotes/deploy/main && \
             docker compose --env-file .env.production build app && \
             docker compose --env-file .env.production up --no-build --force-recreate -d app nginx && \
             docker compose --env-file .env.production ps && \
             curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ > /dev/null"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
