server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The application accepts images up to 5 MB; multipart requests need room.
    client_max_body_size 10m;

    location /uploads/ {
        alias /srv/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
    }

    location / {
        # Resolve the Compose service at request time. This keeps Nginx alive
        # while the app container starts and refreshes the address after an
        # app container restart.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $app_upstream app:3000;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
